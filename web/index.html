<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The ground runs under notches and the installed app's status bar (the shell pads itself by
         the safe-area insets); the soft keyboard shrinks the layout, so the composer stays above it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark light" />
    <!-- theme-color: generated from design/tokens.json by `cargo xtask tokens` -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#110B11" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F1F6" />
    <!-- /theme-color -->
    <!-- Generated from the mascot tokens by `cargo xtask tokens`. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Mellow</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
