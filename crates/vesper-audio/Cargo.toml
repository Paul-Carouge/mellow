[package]
name = "vesper-audio"
description = "Vesper's PipeWire audio capture on Linux (desktop, devices, one application's streams), mixed and encoded to Opus."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# No doc-tests: skips an empty rustdoc run per `cargo test`.
doctest = false

# Linux only: on other systems the crate is empty (ADR-0051).
[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
opus.workspace = true
pipewire = { workspace = true, features = ["v0_3_50"] }
tracing.workspace = true
vesper-core.workspace = true
vesper-dsp.workspace = true

[lints]
workspace = true
