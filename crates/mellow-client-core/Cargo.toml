[package]
name = "mellow-client-core"
description = "Client logic for native Mellow clients to come: connection, state, sync."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
futures-util.workspace = true
getrandom.workspace = true
icu_properties.workspace = true
mellow-protocol.workspace = true
reqwest = { workspace = true, features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "net"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
tracing.workspace = true
unicode-normalization.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
anyhow.workspace = true
# Authenticator codes and test pictures; both already build for the server.
aws-lc-rs.workspace = true
image.workspace = true
# Integration tests run a real in-process server; the client never depends on it otherwise.
mellow-server = { path = "../mellow-server" }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
