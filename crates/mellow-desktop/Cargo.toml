[package]
name = "mellow-desktop"
description = "The Mellow desktop client (Slint)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Already in the tree through Slint; used directly for "Copy text" (DESIGN.md §5.4).
arboard = { version = "3.7.0", default-features = false }
# Already in the tree through Slint; used for local message timestamps.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
keyring = "4.2.0"
# Already in the tree through keyring; used directly to keep Windows credentials on this machine.
keyring-core = "1.0.1"
mellow-client-core.workspace = true
mellow-protocol.workspace = true
mellow-update.workspace = true
slint = "1.18.1"
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[build-dependencies]
slint-build = "1.18.1"

[lints]
workspace = true
