[package]
name = "mellow-desktop"
description = "The native Mellow desktop client, built on GPUI (ADR-0051)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "mellow"
path = "src/main.rs"

[features]
# GPUI precompiles its Metal shaders with `xcrun metal`, which only a full Xcode with its Metal
# toolchain has; compiling them at startup instead lets every Mac (and CI) build the workspace.
# Release builds on a Mac with the Metal toolchain pass `--no-default-features` (ADR-0051).
default = ["runtime-shaders"]
runtime-shaders = ["gpui_platform/runtime_shaders"]

[dependencies]
anyhow.workspace = true
avif-parse.workspace = true
# Already in the tree through GPUI (with `clock`): the reader's time zone offset at a message's moment.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs.workspace = true
# GPUI from Longbridge's weekly crates.io snapshot of Zed (crates.io only, Apache-2.0). gpui-pre,
# gpui-pre-platform and gpui-component are pinned together and upgraded together (ADR-0051).
gpui = { package = "gpui-pre", version = "=0.3.11" }
# Without `wayland` and `x11` the Linux build has no windowing backend.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["wayland", "x11", "font-kit"] }
gpui-component = "=0.9.0"
# Pinned with gpui-component, which depends on it; Mellow calls it to re-read reduced motion.
gpui-base = "=0.9.0"
# GIF, JPEG, PNG and WebP pictures, still and animated: the version GPUI's own frames use.
image.workspace = true
# The OS secret store (Keychain, Secret Service, Credential Manager) for the session token, as the
# Slint app did (ADR-0051 "Session").
keyring = "4.2.0"
# Already in the tree through keyring; used directly to keep Windows credentials on this machine.
keyring-core = "1.0.1"
mellow-client-core.workspace = true
mellow-protocol.workspace = true
moxcms.workspace = true
rav1d.workspace = true
# Compares the instance's version with the oldest one this app supports.
semver.workspace = true
# The OS's preferred languages; already in the tree through GPUI (same version), so nothing new
# is built or audited.
sys-locale = "0.3.2"
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
tracing.workspace = true
# `tracing-log` forwards the `log` records of GPUI and wgpu, whose errors would otherwise be lost.
tracing-subscriber = { workspace = true, features = ["tracing-log"] }
zeroize.workspace = true

# rav1d's x86-64 assembly builds with nasm (already needed by the server's rav1e); its arm64
# assembly does not build from the published crate (`src/arm/asm-offsets.h` is left out of the
# package), so arm64 decodes with the Rust code paths.
[target.'cfg(target_arch = "x86_64")'.dependencies]
rav1d = { workspace = true, features = ["asm"] }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
# Authenticator codes for the two-factor test; already built for the server.
aws-lc-rs.workspace = true
# The sign-in tests run a real in-process server, as the client core's do.
mellow-server = { path = "../mellow-server" }
# Sample messages in tests, as the instance sends them.
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["sync", "macros", "io-util", "test-util"] }
zeroize.workspace = true

[lints]
workspace = true
