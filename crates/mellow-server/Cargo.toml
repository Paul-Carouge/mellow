[package]
name = "mellow-server"
description = "The Mellow server: a single self-hostable binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Embeds web/dist (build it first with npm) and serves it at `/` (ADR-0019).
web-client = []

[dependencies]
anyhow.workspace = true
argon2.workspace = true
aws-lc-rs.workspace = true
async-trait.workspace = true
axum.workspace = true
axum-server.workspace = true
clap.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hkdf.workspace = true
gif.workspace = true
image.workspace = true
hyper-util.workspace = true
mellow-update.workspace = true
ipnet.workspace = true
mellow-protocol.workspace = true
oxipng.workspace = true
rpassword.workspace = true
rustls-acme.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
toml.workspace = true
tracing.workspace = true
webp-animation.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
zeroize.workspace = true

# Owner check of the certificate directory (no libc binding of our own).
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

# Apple platforms build SQLCipher on CommonCrypto; elsewhere OpenSSL is vendored so the binary needs no system libcrypto.
[target.'cfg(target_vendor = "apple")'.dependencies]
libsqlite3-sys = { workspace = true, features = ["bundled-sqlcipher"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
libsqlite3-sys = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["test-util", "process"] }
rcgen.workspace = true
reqwest.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true
tower.workspace = true

[lints]
workspace = true
