[package]
name = "mellow-server"
description = "The Mellow server: a single self-hostable binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
argon2.workspace = true
axum.workspace = true
clap.workspace = true
getrandom.workspace = true
hkdf.workspace = true
mellow-protocol.workspace = true
rpassword.workspace = true
serde.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
zeroize.workspace = true

# Apple platforms build SQLCipher on CommonCrypto; elsewhere OpenSSL is vendored so the binary needs no system libcrypto.
[target.'cfg(target_vendor = "apple")'.dependencies]
libsqlite3-sys = { workspace = true, features = ["bundled-sqlcipher"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
libsqlite3-sys = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
tower.workspace = true

[lints]
workspace = true
