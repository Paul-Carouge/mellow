[package]
name = "mellow-media"
description = "The desktop client's voice engine: WebRTC peer, audio devices, processing and codecs. No UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cpal.workspace = true
# Soundboard sounds are downloaded through the client core's REST client.
mellow-client-core.workspace = true
mellow-protocol.workspace = true
nnnoiseless.workspace = true
# Audio attachments: Ogg Opus pages, and the other types the instance serves inline, with the
# decoders the server already uses for transcoding (ADR-0045).
ogg.workspace = true
opus.workspace = true
rtrb.workspace = true
rubato.workspace = true
sonora.workspace = true
str0m.workspace = true
# Ogg Vorbis: sound effects people pick for the soundboard, and attachments the instance keeps as
# uploaded (it never transcodes Ogg).
symphonia = { workspace = true, features = ["ogg", "vorbis"] }
thiserror.workspace = true
tracing.workspace = true
yuv.workspace = true

# Linux desktops run PipeWire: its own host lists the devices by their PipeWire node name, stable
# across launches, with the session's real default; without a PipeWire daemon cpal falls back to
# ALSA (ids are ALSA PCM names, by card name, also stable).
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { workspace = true, features = ["pipewire"] }

# Cameras through AVFoundation, with the objc2 crates GPUI already brings (ADR-0051).
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "objc2"] }
objc2 = "0.6.5"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "dispatch2", "objc2-core-media", "AVCaptureDevice", "AVCaptureInput", "AVCaptureOutputBase", "AVCaptureSession", "AVCaptureSessionPreset", "AVCaptureVideoDataOutput", "AVMediaFormat"] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-audio-types", "objc2-core-video", "CMBase", "CMSampleBuffer", "CMTime"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSEnumerator", "NSError", "NSObject", "NSString", "NSValue"] }
# Screen sharing through ScreenCaptureKit (ADR-0054), already in the tree through GPUI.
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "dispatch2", "objc2-core-foundation", "libc", "objc2-core-graphics", "objc2-core-media", "SCError", "SCScreenshotManager", "SCShareableContent", "SCStream"] }

[build-dependencies]
cc.workspace = true
sha2.workspace = true

[dev-dependencies]
anyhow.workspace = true
futures-util.workspace = true
# Integration tests run a real in-process server; the engine never depends on it otherwise.
mellow-server = { path = "../mellow-server" }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite.workspace = true

[lints]
workspace = true
