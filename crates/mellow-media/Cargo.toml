[package]
name = "mellow-media"
description = "The desktop client's voice engine: WebRTC peer, audio devices, processing and codecs. No UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cpal.workspace = true
# Soundboard sounds are downloaded through the client core's REST client.
mellow-client-core.workspace = true
mellow-protocol.workspace = true
nnnoiseless.workspace = true
# Audio attachments: Ogg Opus pages, and the other types the instance serves inline, with the
# decoders the server already uses for transcoding (ADR-0045).
ogg.workspace = true
opus.workspace = true
rtrb.workspace = true
rubato.workspace = true
sonora.workspace = true
str0m.workspace = true
# Ogg Vorbis: sound effects people pick for the soundboard, and attachments the instance keeps as
# uploaded (it never transcodes Ogg).
symphonia = { workspace = true, features = ["ogg", "vorbis"] }
thiserror.workspace = true
tracing.workspace = true
yuv.workspace = true

# Linux desktops run PipeWire: its own host lists the devices by their PipeWire node name, stable
# across launches, with the session's real default; without a PipeWire daemon cpal falls back to
# ALSA (ids are ALSA PCM names, by card name, also stable).
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { workspace = true, features = ["pipewire"] }
# Cameras (ADR-0051) and screen sharing (ADR-0054): PipeWire cameras, the ScreenCast portal and
# PipeWire, VA-API H.264 and PipeWire sound through Vesper's crates; X11 sessions through x11rb
# (already in the tree through GPUI), with MIT-SHM's System V segment through libc.
libc.workspace = true
vesper-audio.workspace = true
vesper-capture.workspace = true
vesper-core.workspace = true
vesper-encode.workspace = true
x11rb = { version = "0.13.2", default-features = false, features = ["composite", "randr", "shm"] }
# Received H.264 (ADR-0052) through the system FFmpeg the Linux desktop already links for
# Vesper's encoder (ADR-0051's amendment).
rusty_ffmpeg.workspace = true

# Cameras through AVFoundation, with the objc2 crates GPUI already brings (ADR-0051).
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "objc2"] }
objc2 = "0.6.5"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "dispatch2", "objc2-core-media", "AVCaptureDevice", "AVCaptureInput", "AVCaptureOutputBase", "AVCaptureSession", "AVCaptureSessionPreset", "AVCaptureVideoDataOutput", "AVMediaFormat"] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-audio-types", "objc2-core-video", "CMBase", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSEnumerator", "NSError", "NSObject", "NSString", "NSValue"] }
# Screen sharing through ScreenCaptureKit (ADR-0054), already in the tree through GPUI.
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "dispatch2", "objc2-core-foundation", "libc", "objc2-core-graphics", "objc2-core-media", "SCError", "SCScreenshotManager", "SCShareableContent", "SCStream"] }
# Received H.264 (ADR-0052) through VideoToolbox, the system's decoder.
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFBase", "CFDictionary"] }
objc2-video-toolbox = { version = "0.3.2", default-features = false, features = ["std", "VTDecompressionSession", "VTErrors", "objc2-core-media", "objc2-core-video"] }

# Cameras and received H.264 through Media Foundation, screen sharing through
# Windows.Graphics.Capture, Direct3D 11 and GDI, and its sound through WASAPI's process loopback:
# the `windows` crate cpal and GPUI already bring, with the features these need.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
] }
# `windows::core::implement`'s expansion names `windows_core` (the WASAPI activation callback).
windows-core = "0.62.2"

[build-dependencies]
cc.workspace = true
sha2.workspace = true

[dev-dependencies]
anyhow.workspace = true
futures-util.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite.workspace = true

[target.'cfg(not(windows))'.dev-dependencies]
# Integration tests run a real in-process server; the engine never depends on it otherwise.
# Not on Windows: the server refuses to run there (ADR-0006) and the tests that start one are
# compiled out, so building it (and its vendored OpenSSL) would be wasted.
mellow-server = { path = "../mellow-server" }

[lints]
workspace = true
