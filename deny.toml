# cargo-deny configuration: licenses compatible with AGPL-3.0, no known vulnerabilities, crates.io only.

[graph]
all-features = false
# Only the platforms Mellow builds for are checked. `cfg(fuzzing)`-only dependencies (rav1e's
# libfuzzer-sys, under the NCSA licence) are never compiled into them, so they leave the graph.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
]

[advisories]
version = 2
yanked = "deny"
# Vulnerabilities always fail. "Unmaintained" fails only for our direct dependencies: deep
# transitive ones (e.g. under winit/AccessKit) have no upgrade path we control.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# The allow-list anticipates future dependencies; unused entries are expected.
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    # Zero-clause BSD, more permissive than MIT: enum-iterator, under gpui-component (ADR-0051).
    "0BSD",
    "BSD-2-Clause",
    "BSL-1.0",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "AGPL-3.0-or-later",
]
# Mozilla's root certificate list, bundled by rustls-acme (server, to reach the certificate
# authority). A permissive data licence. rustls-platform-verifier bundles it only on wasm32, a
# target outside the graph.
exceptions = [
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
    # The same Mozilla list as certificates, for the link preview client (ADR-0041), so the
    # server reaches HTTPS sites without a CA bundle on the host.
    { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# TLS is rustls only; OpenSSL is allowed solely as SQLCipher's crypto backend (ADR-0006).
deny = [
    { crate = "openssl-sys", wrappers = ["libsqlite3-sys"] },
    { crate = "openssl" },
    { crate = "native-tls" },
]
# Duplicate versions that `cargo update` cannot remove: an upstream crate pins the older (or, for
# base64 and syn, the other) major version. Each entry names the exact version so that a new
# duplicate still warns; delete an entry once its upstream moves on.
skip = [
    { crate = "hashbrown@0.16.1", reason = "hashlink 0.11 under sqlx-core 0.9" },
    { crate = "miniz_oxide@0.8.9", reason = "png 0.18 (image, resvg)" },
    { crate = "nom@7.1.3", reason = "x509-parser 0.18 (rustls-acme) and cexpr (bindgen)" },
    { crate = "syn@2.0.119", reason = "many proc-macro crates (sqlx, axum, tracing...) not yet on syn 3" },
    { crate = "synstructure@0.13.2", reason = "asn1-rs-derive 0.6, under x509-parser" },
    { crate = "getrandom@0.3.4", reason = "rand_core 0.9 (rand 0.9) and ahash 0.8" },
    # The voice SFU (str0m's DTLS crate dimpl) and the axum WebSocket upgrade still use the
    # RustCrypto 0.10 generation, rand 0.9 and tungstenite 0.29; sqlx-core 0.9 uses sha2 0.10.
    { crate = "crypto-common@0.1.6", reason = "cipher 0.4, aead 0.5 and digest 0.10" },
    # The desktop's keyring (secret-service 5, ADR-0051) is on RustCrypto 0.11; dimpl and GPUI's
    # oo7 are still on 0.10.
    { crate = "aes@0.8.4", reason = "dimpl 0.7 (str0m) and oo7 0.6 (gpui-pre-linux)" },
    { crate = "cbc@0.1.2", reason = "oo7 0.6, under gpui-pre-linux" },
    { crate = "cipher@0.4.4", reason = "aes 0.8, cbc 0.1 and ccm, see above" },
    { crate = "inout@0.1.4", reason = "cipher 0.4, see above" },
    { crate = "block-padding@0.3.3", reason = "inout 0.1, see above" },
    { crate = "cpufeatures@0.2.17", reason = "aes 0.8, sha1 0.10 and sha2 0.10" },
    { crate = "digest@0.10.7", reason = "sha1 0.10 (axum, tungstenite 0.29) and sha2 0.10 (sqlx-core 0.9)" },
    { crate = "block-buffer@0.10.4", reason = "digest 0.10, see above" },
    { crate = "sha1@0.10.7", reason = "axum 0.8 and tungstenite 0.29" },
    { crate = "sha2@0.10.9", reason = "sqlx-core 0.9 and sqlx-macros-core 0.9" },
    { crate = "const-oid@0.9.6", reason = "der 0.7 and x509-cert 0.2, under dimpl 0.7" },
    { crate = "rand@0.9.5", reason = "dimpl 0.7, sctp-proto 0.10 and tungstenite 0.29" },
    { crate = "rand_core@0.9.5", reason = "rand 0.9, see above" },
    { crate = "tungstenite@0.29.0", reason = "axum 0.8's WebSocket support pins tokio-tungstenite 0.29" },
    { crate = "tokio-tungstenite@0.29.0", reason = "axum 0.8's WebSocket support" },
    { crate = "rcgen@0.14.10", reason = "dimpl 0.7; the server and rustls-acme 0.15 use rcgen 0.13" },
    { crate = "yasna@0.6.0", reason = "rcgen 0.14, see above" },
    { crate = "base64@0.22.1", reason = "axum 0.8, sqlx-core 0.9, rustls-acme 0.15 and pem 3; reqwest and usvg use 0.23" },
    # The desktop client's GPUI stack (ADR-0051): gpui-pre, gpui-component, their platform crates
    # (wgpu, AccessKit, objc2, windows) and build tools pin older majors than the rest of the tree.
    # Each reason names the crates that pull the older version; revisit with each GPUI snapshot.
    { crate = "bit-set@0.10.0", reason = "naga 30.0, wgpu-core 30.0, wgpu-hal 30.0" },
    { crate = "bit-vec@0.9.1", reason = "bit-set 0.10, wgpu-core 30.0, yasna 0.6" },
    { crate = "bitflags@1.3.2", reason = "cocoa 0.25, cocoa-foundation 0.1, core-graphics 0.23, core-graphics-types 0.1, fluent-uri 0.1, globwalk 0.8, lsp-types 0.97, png 0.17" },
    { crate = "convert_case@0.10.0", reason = "derive_more-impl 2.1" },
    { crate = "dirs@5.0.1", reason = "zed-font-kit 0.14" },
    { crate = "dirs-sys@0.4.1", reason = "dirs 5.0" },
    { crate = "font-types@0.11.3", reason = "read-fonts 0.37" },
    { crate = "getrandom@0.2.17", reason = "const-random-macro 0.1, rand_core 0.6, redox_users 0.4, ring 0.17" },
    { crate = "gif@0.13.3", reason = "resvg 0.45" },
    { crate = "hashbrown@0.14.5", reason = "zed-xim 0.4" },
    { crate = "heck@0.4.1", reason = "cbindgen 0.28" },
    { crate = "hkdf@0.12.4", reason = "oo7 0.6" },
    { crate = "hmac@0.12.1", reason = "hkdf 0.12, oo7 0.6, pbkdf2 0.12" },
    { crate = "imagesize@0.13.0", reason = "usvg 0.45" },
    { crate = "imagesize@0.14.0", reason = "usvg 0.46" },
    { crate = "itertools@0.11.0", reason = "rust-i18n-support 4.2" },
    { crate = "itertools@0.13.0", reason = "criterion 0.8, criterion-plot 0.8, gpui-base 0.9, gpui-component 0.9" },
    { crate = "jni-sys@0.3.1", reason = "ndk 0.9 and ndk-sys 0.6 under cpal 0.18 and GPUI; jni 0.22 uses 0.4" },
    { crate = "kurbo@0.11.3", reason = "svgtypes 0.15, usvg 0.45" },
    { crate = "objc2@0.5.3", reason = "accesskit_macos 0.26, block2 0.5, objc2-app-kit 0.2, objc2-core-data 0.2, objc2-core-image 0.2, objc2-foundation 0.2, objc2-metal 0.2, objc2-quartz-core 0.2" },
    { crate = "objc2-app-kit@0.2.2", reason = "accesskit_macos 0.26" },
    { crate = "objc2-foundation@0.2.2", reason = "accesskit_macos 0.26, objc2-app-kit 0.2, objc2-core-data 0.2, objc2-core-image 0.2, objc2-metal 0.2, objc2-quartz-core 0.2" },
    { crate = "phf@0.11.3", reason = "markup5ever 0.12" },
    { crate = "phf_generator@0.11.3", reason = "phf_codegen 0.11, string_cache_codegen 0.5" },
    { crate = "phf_shared@0.11.3", reason = "phf 0.11, phf_codegen 0.11, phf_generator 0.11, string_cache 0.8, string_cache_codegen 0.5" },
    { crate = "png@0.17.16", reason = "tiny-skia 0.11" },
    { crate = "pollster@0.2.5", reason = "postage 0.5" },
    { crate = "quick-error@1.2.3", reason = "rusty-fork 0.3" },
    { crate = "rand@0.8.8", reason = "phf_generator 0.11, zed-scap 0.0" },
    { crate = "rand_core@0.6.4", reason = "rand 0.8, rand_chacha 0.3" },
    { crate = "read-fonts@0.37.0", reason = "harfrust 0.5, skrifa 0.40" },
    { crate = "resvg@0.45.1", reason = "gpui-component 0.9" },
    { crate = "resvg@0.46.0", reason = "gpui-pre 0.3" },
    { crate = "roxmltree@0.20.0", reason = "fontconfig-parser 0.5, usvg 0.45" },
    { crate = "rustc-hash@1.1.0", reason = "naga 30.0, naga-types 30.0, wgpu-core 30.0" },
    { crate = "serde_spanned@0.6.9", reason = "toml 0.8, toml_edit 0.22" },
    { crate = "skrifa@0.40.0", reason = "cosmic-text 0.19" },
    { crate = "spin@0.9.9", reason = "flume 0.12" },
    { crate = "svgtypes@0.15.3", reason = "resvg 0.45, usvg 0.45" },
    { crate = "thiserror@1.0.69", reason = "ndk 0.9 under cpal 0.18 (Android backend, never built), filedescriptor 0.8, postage 0.5, redox_users 0.4, tokio-socks 0.5" },
    { crate = "thiserror-impl@1.0.69", reason = "thiserror 1.0" },
    { crate = "tiny-skia@0.11.4", reason = "resvg 0.45, resvg 0.46" },
    { crate = "tiny-skia-path@0.11.4", reason = "tiny-skia 0.11, usvg 0.45, usvg 0.46" },
    { crate = "toml@0.8.23", reason = "cbindgen 0.28, rust-i18n-support 4.2" },
    { crate = "toml_datetime@0.6.11", reason = "toml 0.8, toml_edit 0.22" },
    { crate = "toml_edit@0.22.27", reason = "toml 0.8" },
    { crate = "usvg@0.45.1", reason = "resvg 0.45" },
    { crate = "usvg@0.46.0", reason = "gpui-pre 0.3, resvg 0.46" },
    { crate = "windows@0.58.0", reason = "gpui-base 0.9, gpui-component 0.9" },
    { crate = "windows-core@0.58.0", reason = "windows 0.58" },
    { crate = "windows-implement@0.58.0", reason = "windows-core 0.58" },
    { crate = "windows-interface@0.58.0", reason = "windows-core 0.58" },
    { crate = "windows-result@0.2.0", reason = "windows-core 0.58, windows-strings 0.1" },
    { crate = "windows-strings@0.1.0", reason = "windows-core 0.58" },
    { crate = "windows-sys@0.48.0", reason = "dirs-sys 0.4" },
    { crate = "windows-targets@0.48.5", reason = "windows-sys 0.48" },
    { crate = "windows-targets@0.52.6", reason = "windows 0.57, windows 0.58, windows-core 0.57, windows-core 0.58, windows-result 0.1, windows-result 0.2, windows-strings 0.1, windows-sys 0.52" },
    { crate = "windows_x86_64_gnu@0.48.5", reason = "windows-targets 0.48" },
    { crate = "windows_x86_64_gnu@0.52.6", reason = "windows-targets 0.52" },
    { crate = "windows_x86_64_msvc@0.48.5", reason = "windows-targets 0.48" },
