# cargo-deny configuration: licenses compatible with AGPL-3.0, no known vulnerabilities, crates.io only.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Vulnerabilities always fail. "Unmaintained" fails only for our direct dependencies: deep
# transitive ones (e.g. under winit/AccessKit) have no upgrade path we control.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# The allow-list anticipates future dependencies; unused entries are expected.
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSL-1.0",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "AGPL-3.0-or-later",
    # Slint (ADR-0010) is used under GPL-3.0-only, which may be combined with AGPL-3.0 (GPLv3 §13).
    "GPL-3.0-only",
]
# Mozilla's root certificate list, bundled by rustls-platform-verifier (client) and rustls-acme
# (server, to reach the certificate authority). A permissive data licence.
exceptions = [
    { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# TLS is rustls only; OpenSSL is allowed solely as SQLCipher's crypto backend (ADR-0006).
deny = [
    { crate = "openssl-sys", wrappers = ["libsqlite3-sys"] },
    { crate = "openssl" },
    { crate = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
