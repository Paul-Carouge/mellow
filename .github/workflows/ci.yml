name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly run so new RustSec advisories are caught even without a pull request.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Linux desktop build: Slint (fontconfig, xkbcommon), the secret store (D-Bus), the clipboard (xcb).
  LINUX_DESKTOP_PACKAGES: pkg-config libfontconfig1-dev libxkbcommon-dev libdbus-1-dev libxcb1-dev

jobs:
  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: |
          # shellcheck disable=SC2086 # the package list is split into words on purpose
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends ${LINUX_DESKTOP_PACKAGES}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Design tokens are generated and pass their contrast pairs
        run: cargo xtask tokens --check
      - name: The Docker kit carries the release public key
        run: cmp release/minisign.pub deploy/docker/minisign.pub
      - name: The install script carries the release public key
        run: grep -qF "$(tail -n 1 release/minisign.pub)" install.sh
      - name: Shell scripts pass shellcheck
        run: shellcheck -s sh install.sh && shellcheck deploy/docker/mellow-update

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux only while the web client is the focus and releases carry the Linux server only
        # (ADR-0023). Add macOS and Windows back when their port starts: SQLCipher uses a
        # different crypto backend on each (ADR-0006).
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          # shellcheck disable=SC2086 # the package list is split into words on purpose
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends ${LINUX_DESKTOP_PACKAGES}
      # Every crate's tests run even when one fails, so one platform gap hides nothing else.
      - run: cargo test --workspace --locked --no-fail-fast

  web:
    name: Web client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Type-check, test and build
        working-directory: web
        run: npm ci --ignore-scripts && npm audit signatures && npm run check && npm run test && npm run build
      - name: Dependency audit
        working-directory: web
        run: npm audit --audit-level=high
      - name: The server embeds the built client
        run: cargo build --locked -p mellow-server --features web-client

  acme:
    name: ACME against Pebble
    runs-on: ubuntu-latest
    env:
      PEBBLE_VERSION: v2.10.1
      # Pebble publishes no checksum file; this is the asset digest GitHub reports for the release
      # (`gh api repos/letsencrypt/pebble/releases/tags/v2.10.1`).
      PEBBLE_SHA256: 4f2fcb5bca8c85c9cf73ad140fccfc0d2be40bd81ab99879c79b7b8a0b4f70ed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Pebble, the ACME test authority
        run: |
          curl --fail --silent --show-error --location --output pebble.tar.gz \
            "https://github.com/letsencrypt/pebble/releases/download/${PEBBLE_VERSION}/pebble-linux-amd64.tar.gz"
          echo "${PEBBLE_SHA256}  pebble.tar.gz" | sha256sum --check
          tar xzf pebble.tar.gz
          # The release archive does not keep the executable bit.
          chmod +x pebble-linux-amd64/linux/amd64/pebble
          echo "MELLOW_PEBBLE_BINARY=${PWD}/pebble-linux-amd64/linux/amd64/pebble" >> "$GITHUB_ENV"
      - run: cargo test -p mellow-server --locked --lib tls::tests -- --ignored

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
