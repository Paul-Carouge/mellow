name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly run so new RustSec advisories are caught even without a pull request.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The server's AVIF encoder (rav1e) and the desktop's libvpx (built from source by
  # mellow-media's build.rs, ADR-0051) assemble their x86-64 code with nasm (ADR-0033); libopus,
  # linked into the server for audio attachments, is built from source by cmake (ADR-0045).
  # libvpx also needs make, curl and tar, which the runner image has.
  # The desktop voice engine's audio devices go through ALSA's headers (ADR-0051).
  SERVER_BUILD_PACKAGES: nasm cmake libasound2-dev
  # The desktop client's GPUI links xkbcommon, fontconfig and FreeType and builds its Wayland and
  # X11 backends (ADR-0051); the jobs building the whole workspace need them. Zed's list, plus
  # PipeWire's headers and libclang for the voice engine's audio devices (cpal's PipeWire host).
  # Global push-to-talk adds none (ADR-0053): global-hotkey's X11 grab speaks the protocol in pure
  # Rust (x11rb) and the Wayland portal goes through zbus.
  DESKTOP_BUILD_PACKAGES: pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan1 libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libpipewire-0.3-dev libclang-dev
  # Vesper's Linux capture and encoder (ADR-0051), linked by the desktop's screen sharing
  # (ADR-0054, whose X11 capture adds none: x11rb is pure Rust): PipeWire, VA-API and FFmpeg's headers and
  # libraries, and libclang for the bindgen runs of pipewire-sys and rusty_ffmpeg. The code calls
  # only libavcodec, libavfilter and libavutil, but rusty_ffmpeg's build script probes all seven.
  VESPER_BUILD_PACKAGES: libpipewire-0.3-dev libva-dev libclang-dev libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev
  # The camera decoder's tests make their JPEGs with the ffmpeg command and skip without it.
  VESPER_TEST_PACKAGES: ffmpeg

jobs:
  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: |
          # shellcheck disable=SC2086 # the package list is split into words on purpose
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends ${SERVER_BUILD_PACKAGES} ${DESKTOP_BUILD_PACKAGES} ${VESPER_BUILD_PACKAGES}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Design tokens are generated and pass their contrast pairs
        run: cargo xtask tokens --check
      - name: The desktop string catalogue is generated from the web's
        run: cargo xtask i18n --check
      - name: The Docker kit carries the release public key
        run: cmp release/minisign.pub deploy/docker/minisign.pub
      - name: Shell scripts pass shellcheck
        run: shellcheck deploy/docker/mellow-update

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux only while the web client is the focus and releases carry the Linux server only
        # (ADR-0023). Add macOS and Windows back when their port starts: SQLCipher uses a
        # different crypto backend on each (ADR-0006).
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          # shellcheck disable=SC2086 # the package list is split into words on purpose
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends ${SERVER_BUILD_PACKAGES} ${DESKTOP_BUILD_PACKAGES} ${VESPER_BUILD_PACKAGES} ${VESPER_TEST_PACKAGES}
      # Every crate's tests run even when one fails, so one platform gap hides nothing else.
      # The desktop client is tested apart: built together, Cargo would unify GPUI's features
      # (serde_json `preserve_order`, ...) into the server, which its release build (`-p
      # mellow-server`) does not have.
      - run: cargo test --workspace --exclude mellow-desktop --locked --no-fail-fast
      - run: cargo test -p mellow-desktop --locked --no-fail-fast

  desktop-macos:
    name: Desktop client (macOS)
    # The desktop client and its voice engine are first-class on macOS (ADR-0051): they must build
    # there (CoreAudio, GPUI). Their tests run on Linux with the rest of the workspace; the default
    # `runtime-shaders` feature needs no Xcode Metal toolchain.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked -p mellow-desktop -p mellow-media
      # Vesper's audio filters are portable (ADR-0051): tested on macOS too.
      - run: cargo test --locked -p vesper-dsp -p vesper-core

  desktop-windows:
    name: Desktop client (Windows)
    # Lints and tests the desktop client, its voice engine and the crates they share, so Windows
    # does not drift while macOS and Linux come first (ADR-0051). The server is built only as their
    # tests' dependency: it refuses to run on Windows (ADR-0006), so its tests stay on Linux and the
    # tests that start one are left out here (`#![cfg(not(windows))]`). libvpx is built from source by MSBuild (mellow-media's build.rs), driven by
    # MSYS2's sh and make (preinstalled on the runner; first in PATH, since a native make would
    # start libvpx's `#!/bin/bash` scripts with WSL's bash) and assembled by yasm; nasm assembles
    # rav1d and aws-lc; libopus is built by cmake (on the runner).
    runs-on: windows-latest
    env:
      # The tests' in-process server vendors OpenSSL for SQLCipher, whose Configure needs a Windows
      # perl: MSYS2's, first in PATH for libvpx, writes Unix paths. Strawberry Perl is on the runner.
      OPENSSL_SRC_PERL: C:\Strawberry\perl\bin\perl.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install the C build tools
        shell: pwsh
        run: |
          choco install --yes --no-progress nasm yasm
          C:\msys64\usr\bin\pacman.exe --sync --noconfirm --needed make diffutils perl
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Clippy
        shell: pwsh
        run: |
          # rustc and cc find MSVC's link.exe by its full path, so MSYS2's link does not matter.
          $env:PATH = "C:\msys64\usr\bin;$env:PATH"
          cargo clippy --locked --all-targets -p mellow-desktop -p mellow-media -p mellow-client-core -p mellow-protocol -- -D warnings
      - name: Test
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\usr\bin;$env:PATH"
          cargo test --locked --no-fail-fast -p mellow-desktop -p mellow-media -p mellow-client-core -p mellow-protocol

  web:
    name: Web client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install the server's build dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ${SERVER_BUILD_PACKAGES}
      - name: Type-check, test and build
        working-directory: web
        run: npm ci --ignore-scripts && npm audit signatures && npm run check && npm run test && npm run build
      # Accepted low advisories are listed, with why, under "//" in web/package.json.
      - name: Dependency audit
        working-directory: web
        run: npm audit --audit-level=high
      - name: The server embeds the built client
        run: cargo build --locked -p mellow-server --features web-client

  acme:
    name: ACME against Pebble
    runs-on: ubuntu-latest
    env:
      PEBBLE_VERSION: v2.10.1
      # Pebble publishes no checksum file; this is the asset digest GitHub reports for the release
      # (`gh api repos/letsencrypt/pebble/releases/tags/v2.10.1`).
      PEBBLE_SHA256: 4f2fcb5bca8c85c9cf73ad140fccfc0d2be40bd81ab99879c79b7b8a0b4f70ed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install the server's build dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ${SERVER_BUILD_PACKAGES}
      - name: Install Pebble, the ACME test authority
        run: |
          curl --fail --silent --show-error --location --output pebble.tar.gz \
            "https://github.com/letsencrypt/pebble/releases/download/${PEBBLE_VERSION}/pebble-linux-amd64.tar.gz"
          echo "${PEBBLE_SHA256}  pebble.tar.gz" | sha256sum --check
          tar xzf pebble.tar.gz
          # The release archive does not keep the executable bit.
          chmod +x pebble-linux-amd64/linux/amd64/pebble
          echo "MELLOW_PEBBLE_BINARY=${PWD}/pebble-linux-amd64/linux/amd64/pebble" >> "$GITHUB_ENV"
      - run: cargo test -p mellow-server --locked --lib tls::tests -- --ignored

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
