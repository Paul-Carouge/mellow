name: Release

# Builds, signs and publishes a release for a pushed tag `vX.Y.Z` (ADR-0016).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Linux desktop build: Slint (fontconfig, xkbcommon), the secret store (D-Bus), the clipboard (xcb).
  LINUX_DESKTOP_PACKAGES: pkg-config libfontconfig1-dev libxkbcommon-dev libdbus-1-dev libxcb1-dev

jobs:
  # The web client is built apart from the native binaries, without install scripts: npm code
  # never runs where the binaries that get signed are built.
  web:
    name: Build the web client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
      - name: Install the locked packages, check their registry signatures, build
        working-directory: web
        run: npm ci --ignore-scripts && npm audit signatures && npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-client
          path: web/dist
          if-no-files-found: error

  build:
    name: Build (${{ matrix.target }})
    needs: web
    strategy:
      fail-fast: true
      matrix:
        include:
          # Ubuntu 22.04 (glibc 2.35): binaries linked on a newer glibc refuse to start on Debian 12.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, extension: "" }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, extension: "" }
          - { target: aarch64-apple-darwin, os: macos-15, extension: "" }
          - { target: x86_64-pc-windows-msvc, os: windows-2025, extension: ".exe" }
    runs-on: ${{ matrix.os }}
    # No build cache on purpose: a tag run may restore caches written by any run on main, and
    # whatever they contain would be signed.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag is a released version of main
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)"
          # Plain X.Y.Z only: no pre-release may become the "latest" release that updaters install.
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version '${version}' is not X.Y.Z"; exit 1; }
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || { echo "${GITHUB_SHA} is not on main"; exit 1; }
          echo "MELLOW_VERSION=${version}" >> "$GITHUB_ENV"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          # shellcheck disable=SC2086 # the package list is split into words on purpose
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends ${LINUX_DESKTOP_PACKAGES}
      # The server embeds the web client it serves (ADR-0019).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-client
          path: web/dist
      - run: cargo build --release --locked -p mellow-server -p mellow-desktop --features mellow-server/web-client
      - name: Name the assets
        shell: bash
        run: |
          mkdir dist
          for binary in mellow-server mellow-desktop; do
            cp "target/release/${binary}${{ matrix.extension }}" \
              "dist/${binary}-${MELLOW_VERSION}-${{ matrix.target }}${{ matrix.extension }}"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          # Long enough for the approval of the publish job.
          retention-days: 7

  publish:
    name: Sign and publish
    needs: build
    runs-on: ubuntu-24.04
    # Waits for the maintainer's approval; the signing key exists only in this environment.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unsigned-*
          path: dist
          merge-multiple: true
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends minisign
      - name: Exactly the expected assets were built
        working-directory: dist
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected=""
          for binary in mellow-server mellow-desktop; do
            for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin; do
              expected+="${binary}-${version}-${target}"$'\n'
            done
            expected+="${binary}-${version}-x86_64-pc-windows-msvc.exe"$'\n'
          done
          diff <(printf '%s' "${expected}" | sort) <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
      - name: Sign every asset and the digests
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        working-directory: dist
        run: |
          # Signed like the binaries, for installers that check digests only.
          sha256sum mellow-* > "mellow-${GITHUB_REF_NAME#v}-SHA256SUMS"
          umask 077
          key_file="$(mktemp)"
          trap 'rm -f "${key_file}"' EXIT
          printf '%s\n' "${MINISIGN_SECRET_KEY}" > "${key_file}"
          for asset in mellow-*; do
            # The trusted comment names the file, so a signature cannot be replayed for another one.
            minisign -S -s "${key_file}" -m "${asset}" -t "${asset}"
          done
      # shortcut: every release becomes "latest", so a patch of an older line published after a
      # newer version would be offered as an update; tag back-ports only once this is handled.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" --verify-tag --title "Mellow ${GITHUB_REF_NAME}" --generate-notes
