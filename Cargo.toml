[workspace]
resolver = "3"
members = [
    "crates/mellow-client-core",
    "crates/mellow-desktop",
    "crates/mellow-media",
    "crates/mellow-protocol",
    "crates/mellow-server",
    "crates/mellow-update",
    "crates/vesper-audio",
    "crates/vesper-capture",
    "crates/vesper-core",
    "crates/vesper-dsp",
    "crates/vesper-encode",
    "xtask",
]
# Patched dependencies, not members: neither linted nor formatted as Mellow code.
exclude = ["vendor/gpui-pre-wgpu", "vendor/str0m"]

[workspace.package]
version = "0.49.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Paul-Carouge/mellow"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
# Already in the tree through GPUI, with the same runtime: the screen-cast and camera portals of Vesper's capture (ADR-0051).
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "camera", "screencast"] }
# Already in the tree through ashpd and zbus: runs the portal calls of Vesper's capture.
async-io = "2.6.0"
futures-lite = "2.6.1"
# Already in the tree through rustls (same features); AES-256-GCM for attachment files (ADR-0020).
aws-lc-rs = { version = "1.18.2", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
async-trait = "0.1.92"
axum-server = "0.8.0"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["macros", "ws"] }
# Already in the tree through other build scripts; compiles the desktop's small libvpx face (ADR-0051).
cc = "1.9.0"
clap = { version = "4.6.7", features = ["derive"] }
# Audio devices of the desktop voice engine: CoreAudio, WASAPI, ALSA (ADR-0051).
cpal = "0.18.2"
# Already in the tree through GPUI; the per-user cache directory of the desktop picture cache.
dirs = "6.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
getrandom = "0.4.3"
# Push-to-talk while the desktop app is not focused, on macOS, Windows and X11 (ADR-0053).
global-hotkey = "0.10.0"
hkdf = "0.13.0"
# Decodes uploaded pictures in pure Rust, four formats only (ADR-0021).
gif = { version = "0.14.2", default-features = false, features = ["std"] }
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
# AVIF container around rav1e's AV1 bitstream (ADR-0033).
avif-serialize = "0.8.9"
# Reads the AVIF container of the pictures the server stores, for the desktop decoder (ADR-0051).
avif-parse = "2.1.0"
hyper-util = { version = "0.1.21", features = ["tokio"] }
# Already in the tree through url's IDNA; Unicode properties (letters, diacritics) the web client's regular expressions read.
icu_properties = "2.3.0"
# Already in the tree through axum; wraps request and response bodies to bound HTTP/2 stalls.
http-body = "1.1.0"
# Already in the tree through hyper; tests drive HTTP/2 flow control and pings with its client.
h2 = "0.4.20"
# Already in the tree through hyper-util; `serde` reads proxy networks from mellow.toml.
ipnet = { version = "2.12.2", features = ["serde"] }
mellow-protocol = { path = "crates/mellow-protocol" }
mellow-client-core = { path = "crates/mellow-client-core" }
mellow-update = { path = "crates/mellow-update" }
mellow-media = { path = "crates/mellow-media" }
# Vesper's capture and encoding engine, copied by permission of its author (ADR-0051, NOTICE files).
vesper-audio = { path = "crates/vesper-audio" }
vesper-capture = { path = "crates/vesper-capture" }
vesper-core = { path = "crates/vesper-core" }
vesper-dsp = { path = "crates/vesper-dsp" }
vesper-encode = { path = "crates/vesper-encode" }
# Already in the tree; Vesper's capture and encoder call Linux APIs (DMA-BUF, ioctl, memfd) std lacks.
libc = "0.2.191"
# PipeWire streams for Vesper's screen, camera and application sound capture on Linux (ADR-0051).
pipewire = "0.10.1"
# FFmpeg's C API, generated by bindgen from the system's headers (MIT): Vesper's VAAPI encoder and
# MJPEG camera decoder on Linux. Replaces Vesper's ffmpeg-next, whose WTFPL licence deny.toml refuses.
rusty_ffmpeg = { version = "0.17.0", features = ["link_system_ffmpeg"] }
# Already in the tree through `image`; colour profiles of uploaded pictures (ADR-0033).
moxcms = "0.8.1"
# RNNoise in pure Rust, the "advanced" noise suppression of the desktop voice engine (ADR-0051).
nnnoiseless = { version = "0.5.2", default-features = false }
# Ed25519 minisign verification only, no dependencies of its own (ADR-0016).
minisign-verify = "0.3.0"
# Already in the tree through the workspace's dependencies; compares release versions.
semver = "1.0.28"
# Pure Rust AV1 encoder for AVIF pictures, one thread per job, with its assembly (ADR-0033).
rav1e = { version = "0.8.1", default-features = false, features = ["asm"] }
# Pure Rust AV1 decoder (dav1d port) for the AVIF pictures the desktop shows (ADR-0051). Its
# assembly is enabled per target by mellow-desktop: the published crate lacks the arm64 header.
rav1d = { version = "1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
# Already in the tree through rustls-acme; tests sign the local ACME test authority's HTTPS certificate with it.
rcgen = { version = "0.13.2", default-features = false, features = ["pem", "aws_lc_rs"] }
bitflags = "2.13.2"
# Pulled in only to switch the SQLite bundled by sqlx to SQLCipher (ADR-0006). Must stay within the range sqlx-sqlite accepts (>=0.30.1, <0.38).
libsqlite3-sys = { version = "0.37", default-features = false }
# Property tests of the search query parser (dev only): it must never fail or let user text out of its quotes.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2", "query"] }
rpassword = "7.5.4"
# Wait-free single-producer single-consumer queues between audio callbacks and the voice engine.
rtrb = "0.4.1"
rustix = { version = "1.1.5", default-features = false, features = ["std", "process"] }
rustls-acme = { version = "0.15.4", features = ["axum"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# Echo cancellation, noise suppression and gain control: WebRTC's audio processing in pure Rust (ADR-0051).
sonora = "0.2.0"
# Already in the tree through Tokio: larger UDP buffers for camera bursts (ADR-0035).
socket2 = "0.6.5"
# WebRTC in sans-IO style for the voice SFU (ADR-0030); its crypto is the aws-lc-rs already in the tree.
str0m = { version = "0.24.1", default-features = false, features = ["aws-lc-rs"] }
# Perceptual quality of compressed pictures, run on one thread (ADR-0033).
ssimulacra2 = { version = "0.5.1", default-features = false }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "macros", "migrate"] }
tempfile = "3.27.0"
tracing = "0.1.44"
# Account names (ADR-0048): NFC to store, NFKC and NFKD for the folded key (std has no Unicode normalization; already in Cargo.lock).
unicode-normalization = "0.1.26"
# Already in the tree through GPUI; grapheme clusters, as the web's `Intl.Segmenter` reads them (jumbo emoji).
unicode-segmentation = "1.13.3"
zeroize = { version = "1.9.1", features = ["zeroize_derive"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "signal"] }
toml = "1.1.8"
url = "2.5.8"
webpki-root-certs = "1.0.10"
tower = { version = "0.5.3", features = ["util"] }
tokio-tungstenite = "0.30.0"
# Ogg pages around the Opus packets of transcoded audio attachments (ADR-0045).
ogg = "0.9.2"
# libopus built from source by cmake and linked statically, no system library: audio attachments
# are transcoded to Opus (ADR-0045).
opus = "0.4.0"
# Resamples decoded audio to the 48 kHz Opus encodes, pure Rust, without its FFT resampler.
rubato = { version = "5.0.1", default-features = false }
# Decodes uploaded audio in pure Rust for the Opus transcode, only the formats it takes (ADR-0045).
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "pcm", "flac", "mp3", "aac", "isomp4"] }
# Lossless (animated) WebP encoding through libwebp built from source, no system library (ADR-0021).
webp-animation = { version = "0.10.0", default-features = false, features = ["static"] }
# Pure Rust SIMD colour conversion (BGRA to I420 and back) for the desktop's video (ADR-0051).
yuv = "0.8.20"

[workspace.lints.rust]
# deny, not forbid: Slint-generated code needs a local `allow(unsafe_code)`.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
# Logs go through `tracing`; only the command-line binaries talk to the operator on stderr.
print_stderr = "warn"

# Tests encode real pictures: unoptimised, rav1e and SSIMULACRA2 are tens of times slower.
[profile.dev.package.rav1e]
opt-level = 3

[profile.dev.package.ssimulacra2]
opt-level = 3

[profile.dev.package.yuvxyb]
opt-level = 3

# Voice tests process audio in real time: unoptimised, the echo canceller and RNNoise fall behind.
[profile.dev.package.sonora]
opt-level = 3

[profile.dev.package.nnnoiseless]
opt-level = 3

# Picture tests decode AVIF; unoptimised, the AV1 decoder is tens of times slower.
[profile.dev.package.rav1d]
opt-level = 3

# str0m 0.24.1 with its H.264 FU-A reassembly bounded (ADR-0052): upstream keeps every fragment
# until an end fragment arrives, so a sender could grow server memory without limit. Also, each
# new m-line's random mid avoids the lines added in the same offer: upstream checks only the
# negotiated ones, so about one client offer in 500 repeated a mid and the server refused it.
# Drop the patch once an upstream release fixes both.
[patch.crates-io]
str0m = { path = "vendor/str0m" }
# gpui-pre-wgpu 0.3.11 with the Linux text system reading the system fonts on a background thread
# (the first window no longer waits for them, 380 to 610 ms with a cold disk cache) and emoji fonts
# accepted in a font's fallback chain, so emoji draw in colour (ADR-0059). Drop it once upstream
# does both.
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
