[workspace]
resolver = "3"
members = [
    "crates/mellow-client-core",
    "crates/mellow-desktop",
    "crates/mellow-protocol",
    "crates/mellow-server",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Paul-Carouge/mellow"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum-server = "0.8.0"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["macros", "ws"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
hyper-util = { version = "0.1.21", features = ["tokio"] }
# Already in the tree through hyper-util; `serde` reads proxy networks from mellow.toml.
ipnet = { version = "2.12.2", features = ["serde"] }
mellow-protocol = { path = "crates/mellow-protocol" }
mellow-client-core = { path = "crates/mellow-client-core" }
bitflags = "2.13.2"
# Pulled in only to switch the SQLite bundled by sqlx to SQLCipher (ADR-0006). Must stay within the range sqlx-sqlite accepts (>=0.30.1, <0.38).
libsqlite3-sys = { version = "0.37", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2", "query"] }
rpassword = "7.5.4"
rustix = { version = "1.1.5", default-features = false, features = ["std", "process"] }
rustls-acme = { version = "0.15.4", features = ["axum"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "macros", "migrate"] }
tempfile = "3.27.0"
tracing = "0.1.44"
zeroize = { version = "1.9.1", features = ["zeroize_derive"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "signal"] }
toml = "1.1.8"
url = "2.5.8"
tower = { version = "0.5.3", features = ["util"] }
tokio-tungstenite = "0.30.0"

[workspace.lints.rust]
# deny, not forbid: Slint-generated code needs a local `allow(unsafe_code)`.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
